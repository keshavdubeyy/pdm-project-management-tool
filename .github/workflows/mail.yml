# Wakes the mail job every 15 minutes. The job itself decides what is due
# (quiet hours, weekdays, who has already been mailed), so most runs send
# nothing. Vercel's free plan cannot run a job this often, hence GitHub.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   MAIL_CRON_URL     https://pdm-project-manager.vercel.app/api/cron/mail
#   MAIL_CRON_SECRET  the same value as CRON_SECRET on Vercel
#
# What it does is set by MAIL_MODE on Vercel: off, dry-run or live.

name: mail

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: mail
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the mail job
        env:
          URL: ${{ secrets.MAIL_CRON_URL }}
          SECRET: ${{ secrets.MAIL_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "MAIL_CRON_URL or MAIL_CRON_SECRET is not set."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 --max-time 90 \
            -H "Authorization: Bearer $SECRET" "$URL"
